name: hello-node

on:
  push:
    paths:
      - 'docker/app1-hello/node/**'
      - '.github/workflows/hello-node_ci.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: docker/app1-hello/node
        run: npm install

      - name: Run Tests
        working-directory: docker/app1-hello/node
        run: npm test --if-present

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Check whether GitHub is providing both secrets.
      # This does NOT print the actual secret values.
      - name: Check Docker Hub Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "Docker username length: ${#DOCKER_USERNAME}"
          echo "Docker password length: ${#DOCKER_PASSWORD}"

          if [ -z "$DOCKER_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "ERROR: DOCKERHUB_PASSWORD is empty"
            exit 1
          fi

          echo "Both Docker Hub secrets are available."

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/node
          file: docker/app1-hello/node/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:latest